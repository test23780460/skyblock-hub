<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">SkyPilot</title>
  <defs>
    <linearGradient id="sky" x1="10" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8df1ff"/>
      <stop offset="1" stop-color="#39c9e4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#080d14"/>
  <g fill="none" stroke="url(#sky)" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" filter="url(#glow)">
    <path d="M13 18h24l-5 8H8l5-8Z"/>
    <path d="M24 28h24l-5 8H19l5-8Z"/>
    <path d="M35 38h21l-5 8H30l5-8Z"/>
